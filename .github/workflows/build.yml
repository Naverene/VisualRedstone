# Publishes a release of the mod. Everyday builds run locally with ./build-all.sh (see the README), so
# pull requests and branch pushes no longer use GitHub Actions minutes.
# - pushing a version tag such as v1.2.0 builds every version as that mod version, checks each one
#   loads on a server, publishes one GitHub release with every jar, and uploads each jar to
#   CurseForge when the CURSEFORGE_TOKEN secret is set
# - "Run workflow" on the Actions tab builds every version on demand without publishing anything

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  plan:
    name: Pick the versions to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    env:
      # One entry per version folder. `java` builds it; `cf_java` is the Java version players run it on,
      # as listed on CurseForge. The folder name is the Minecraft version unless `mc` says otherwise.
      # `checkout` lists every folder the build reads, one per line, when that is more than its own: the
      # Fabric build takes its data files from the Forge folder, so a change there rebuilds it too.
      VERSIONS: |
        [
          { "dir": "1.7.10", "java": "21", "cf_java": "8",  "loader": "forge" },
          { "dir": "1.12.2", "java": "8",  "cf_java": "8",  "loader": "forge" },
          { "dir": "1.16.5", "java": "8",  "cf_java": "8",  "loader": "forge" },
          { "dir": "1.18.2", "java": "17", "cf_java": "17", "loader": "forge" },
          { "dir": "1.20.1", "java": "17", "cf_java": "17", "loader": "forge" },
          { "dir": "1.20.1-fabric", "mc": "1.20.1", "checkout": "1.20.1-fabric\n1.20.1", "java": "21", "cf_java": "17", "loader": "fabric" },
          { "dir": "26.3",   "java": "25", "cf_java": "25", "loader": "neoforge" }
        ]
    steps:
    - name: List the versions to build
      id: plan
      run: |
        versions=$(jq -c . <<< "$VERSIONS")
        echo "Building: $(jq -r 'map(.dir) | join(", ")' <<< "$versions")"
        echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.dir }}
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One version failing must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.versions) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
    - uses: actions/checkout@v4
      with:
        # Only this version's folder (and any it reads) is checked out. The 1.7.10 build also gets the
        # commit history, so it can name dev builds after the latest tag with git describe.
        sparse-checkout: ${{ matrix.checkout || matrix.dir }}
        fetch-depth: ${{ matrix.dir == '1.7.10' && '0' || '1' }}

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0
      with:
        # The server check ends runServer by stopping the server, which Gradle reports as a failed
        # task. Show the Gradle summary only when the job fails, so green runs don't list a red X.
        add-job-summary: on-failure

    # A version tag such as v1.2.0 sets the mod version; other builds use the one in gradle.properties.
    # The 1.7.10 build (GTNH buildscript) reads the VERSION variable instead, and names other builds
    # after the latest tag.
    - name: Work out the mod version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME#v}"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
        else
          version=$(git describe --tags --match 'v*' 2>/dev/null | sed 's/^v//')
        fi
        echo "VERSION=${version:-dev}" >> "$GITHUB_ENV"

    - name: Build with Gradle Wrapper
      run: |
        if [[ -n "${MOD_VERSION:-}" ]]; then
          ./gradlew build -Pmod_version="$MOD_VERSION"
        else
          ./gradlew build
        fi

    # Starts a dedicated server with the mod and a fresh world, and fails on a crash, a mod loading
    # error, or a recipe, tag or loot table that does not load.
    - name: Check the mod loads on a server
      run: ./scripts/check-server-starts.sh

    - name: Upload the server log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: server-log-${{ matrix.dir }}
        path: ${{ matrix.dir }}/build/server-check.log
        if-no-files-found: ignore

    # Keep only the jar players install (not the -dev, -sources or -api jars).
    - name: Collect the mod jar
      run: |
        mkdir -p dist
        find build/libs -maxdepth 1 -name '*.jar' \
          ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' \
          -exec cp {} dist/ \;
        ls -l dist

    - name: Upload the mod jar
      uses: actions/upload-artifact@v4
      with:
        name: VisualRedstone-${{ matrix.dir }}
        path: ${{ matrix.dir }}/dist/*.jar
        if-no-files-found: error

  publish:
    name: Publish the jars on GitHub
    needs: build
    # Version tags only. A manual run just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download the mod jars
      uses: actions/download-artifact@v4
      with:
        pattern: VisualRedstone-*
        merge-multiple: true
        path: dist

    - name: Publish the release for this version
      run: |
        ls -l dist
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          # The release was already made on GitHub (for example with "Draft a new release"), so add the jars to it.
          gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
        else
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "Visual Redstone $GITHUB_REF_NAME" \
            --generate-notes
        fi

  curseforge:
    name: CurseForge ${{ matrix.dir }}
    needs: [ plan, publish ]
    # Version tags only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One upload failing must not stop the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.versions) }}
    env:
      # An upload token from CurseForge (account settings > API Tokens), stored as a repository secret.
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      # The CurseForge project id of Visual Redstone (curseforge.com/minecraft/mc-mods/visual-redstone).
      # A CURSEFORGE_PROJECT_ID repository variable overrides it.
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '235932' }}

    steps:
    - name: Download the mod jar
      uses: actions/download-artifact@v4
      with:
        name: VisualRedstone-${{ matrix.dir }}
        path: dist

    - name: Upload the release to CurseForge
      if: env.CURSEFORGE_TOKEN != '' && env.CURSEFORGE_PROJECT_ID != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
        curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
        files: dist/*.jar
        name: Visual Redstone ${{ github.ref_name }} for Minecraft ${{ matrix.mc || matrix.dir }} (${{ matrix.loader }})
        version: ${{ github.ref_name }}-${{ matrix.dir }}
        version-type: release
        changelog: See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        loaders: ${{ matrix.loader }}
        game-versions: ${{ matrix.mc || matrix.dir }}
        java: ${{ matrix.cf_java }}

    - name: Note the skipped CurseForge upload
      if: env.CURSEFORGE_TOKEN == '' || env.CURSEFORGE_PROJECT_ID == ''
      run: echo "::warning::CURSEFORGE_TOKEN or CURSEFORGE_PROJECT_ID is not set, so the ${{ matrix.dir }} jar was not uploaded to CurseForge."
