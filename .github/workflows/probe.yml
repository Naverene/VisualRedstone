# Temporary: prints Minecraft 26.3 / NeoForge client rendering sources so the port can be written against them.
name: Probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "probe/**", ".github/workflows/probe.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe/26.3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Make Minecraft artifacts
      run: ./gradlew --no-daemon createMinecraftArtifacts compileJava || ./gradlew --no-daemon tasks --all | head -100
    - name: Print sources
      run: |
        find / -name '*.jar' -path '*neoforge*' 2>/dev/null | grep -i -E 'sources|merged|minecraft' | head -20
        mkdir -p /tmp/src && cd /tmp/src
        for j in $(find / -name '*sources*.jar' 2>/dev/null | grep -v '/proc/' | grep -i -E 'neoforge|minecraft|moddev'); do echo "JAR $j"; unzip -q -o "$j" || true; done
        find /tmp/src -name 'ShapeRenderer.java' -o -name 'LevelRenderer.java' | head
        ls net/neoforged/neoforge/client/event/ | head -60
        show() { for f in "$@"; do echo "################ $f"; cat "$f" 2>/dev/null | head -400; done; }
        ls net/neoforged/neoforge/client/event/ | head -200
        ls net/minecraft/client/renderer/ | head -300
        ls net/minecraft/gizmos 2>/dev/null
        ls net/minecraft/client/renderer/rendertype 2>/dev/null
        ls net/minecraft/client/renderer/state 2>/dev/null
        show net/minecraft/client/renderer/ShapeRenderer.java
        show net/neoforged/neoforge/client/event/SubmitCustomGeometryEvent.java net/neoforged/neoforge/client/event/ExtractBlockOutlineRenderStateEvent.java net/neoforged/neoforge/client/event/RenderLevelStageEvent.java net/neoforged/neoforge/client/CustomBlockOutlineRenderer.java
        show net/minecraft/client/renderer/state/BlockOutlineRenderState.java
        grep -n -i -B3 -A40 'void renderHitOutline\|renderBlockOutline' net/minecraft/client/renderer/LevelRenderer.java | head -250
        grep -rn 'LINES\|lines\|debugQuads\|DEBUG_QUADS\|NO_DEPTH\|noDepth\|debugFilledBox\|DEBUG_FILLED' net/minecraft/client/renderer/RenderPipelines.java | head -60
        grep -rln 'static RenderType lines\b\|RenderType lines(' net/minecraft/client/renderer | head
        for f in $(grep -rln 'RenderType lines(' net/minecraft/client/renderer | head -2); do grep -n 'public static RenderType\|static RenderType create\|public static .* create(' $f | head -80; done
        show com/mojang/blaze3d/vertex/VertexConsumer.java
        grep -n 'public static final VertexFormat' com/mojang/blaze3d/vertex/DefaultVertexFormat.java
        for f in net/minecraft/gizmos/*.java; do echo "#### $f"; grep -n 'public' $f | head -40; done 2>/dev/null
        grep -n 'getBestNeighborSignal\|getDirectSignalTo\|hasNeighborSignal' net/minecraft/world/level/Level.java net/minecraft/world/level/SignalGetter.java 2>/dev/null | head
        grep -n 'POWER' net/minecraft/world/level/block/RedStoneWireBlock.java | head -3
        grep -n 'MultiBufferSource\|bufferSource\|renderBuffers' net/minecraft/client/Minecraft.java | head
        show net/minecraft/client/renderer/MultiBufferSource.java
        grep -rn 'class .*SubmitNodeCollector\|submitCustomGeometry\|submitShape' net/minecraft/client/renderer/SubmitNodeCollector.java net/minecraft/client/renderer/SubmitNodeStorage.java 2>/dev/null | head -30
        grep -n 'Item.Properties\|setId\|registerSimpleItem\|registerItem' net/neoforged/neoforge/registries/DeferredRegister.java | head -20
