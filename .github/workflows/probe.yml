# Temporary: prints Minecraft 26.3 / NeoForge client rendering APIs so the port can be written against them.
name: Probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "probe/**", ".github/workflows/probe.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe/26.3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Make Minecraft artifacts
      run: ./gradlew --no-daemon createMinecraftArtifacts
    - name: Print APIs
      run: |
        set +e
        find build ~/.gradle -name '*.jar' 2>/dev/null | grep -i -E 'minecraft|neoforge' | grep -v -E 'installertools|binarypatcher' | head -20
        MC=""
        for j in $(find build ~/.gradle -name '*.jar' 2>/dev/null); do
          if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/renderer/ShapeRenderer.class'; then MC="$j"; break; fi
        done
        echo "MC=$MC"
        SRC=$(find ~/.gradle -name 'neoforge-*-sources.jar' | head -1)
        mkdir -p /tmp/nf && (cd /tmp/nf && unzip -q -o "$SRC")
        jp() { for c in "$@"; do echo "################ $c"; javap -cp "$MC" -p "$c" 2>&1 | head -150; done; }
        unzip -l "$MC" | grep -E 'net/minecraft/client/renderer/[A-Za-z]+\.class' | awk '{print $4}' | head -200
        unzip -l "$MC" | grep -E 'net/minecraft/(gizmos|client/renderer/(rendertype|state))/' | awk '{print $4}' | head -150
        jp net.minecraft.client.renderer.ShapeRenderer net.minecraft.client.renderer.MultiBufferSource com.mojang.blaze3d.vertex.VertexConsumer com.mojang.blaze3d.vertex.PoseStack com.mojang.blaze3d.vertex.PoseStack\$Pose
        jp net.minecraft.client.renderer.state.BlockOutlineRenderState net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.RenderType net.minecraft.client.renderer.rendertype.RenderType
        jp net.minecraft.client.Camera net.minecraft.world.level.SignalGetter net.minecraft.world.phys.AABB net.minecraft.world.phys.shapes.VoxelShape
        javap -cp "$MC" -p net.minecraft.client.renderer.LevelRenderer | grep -i -E 'outline|hit|gizmo|submit' | head -40
        javap -cp "$MC" -p net.minecraft.client.renderer.RenderPipelines | grep -i -E 'line|debug|quad|filled|lightning' | head -60
        for f in /tmp/nf/net/neoforged/neoforge/client/event/SubmitCustomGeometryEvent.java /tmp/nf/net/neoforged/neoforge/client/event/ExtractBlockOutlineRenderStateEvent.java /tmp/nf/net/neoforged/neoforge/client/event/RenderLevelStageEvent.java /tmp/nf/net/neoforged/neoforge/client/CustomBlockOutlineRenderer.java; do echo "################ $f"; grep -v '^import\|^ \*\|^/\*\|^$' "$f" | head -200; done
        ls /tmp/nf/net/neoforged/neoforge/client/
        for c in $(unzip -l "$MC" | grep -E 'net/minecraft/gizmos/[A-Za-z]+\.class' | awk '{print $4}' | sed 's/\.class$//; s#/#.#g'); do jp $c; done
