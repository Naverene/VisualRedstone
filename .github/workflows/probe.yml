# Temporary: prints Minecraft 26.3 / NeoForge client rendering APIs so the port can be written against them.
name: Probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "probe/**", ".github/workflows/probe.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe/26.3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Make Minecraft artifacts
      run: ./gradlew --no-daemon createMinecraftArtifacts
    - name: Print APIs
      run: |
        set +e
        MC=build/moddev/artifacts/minecraft-patched-26.3.0.23-beta.jar
        ls -la build/moddev/artifacts/
        jp() { for c in "$@"; do echo "################ $c"; javap -cp "$MC" -p "$c" 2>&1 | head -120; done; }
        unzip -l "$MC" | awk '{print $4}' | grep -E '^net/minecraft/client/renderer/[A-Za-z]+\.class$' | tr '\n' ' '
        echo
        unzip -l "$MC" | awk '{print $4}' | grep -i -E 'shaperender|gizmo|outline|rendertype/|/state/level/' | head -80 | tr '\n' ' '
        echo
        jp net.minecraft.client.renderer.ShapeRenderer net.minecraft.client.renderer.SubmitNodeCollector com.mojang.blaze3d.vertex.VertexConsumer com.mojang.blaze3d.vertex.PoseStack\$Pose
        jp net.minecraft.client.renderer.state.level.BlockOutlineRenderState net.minecraft.client.renderer.state.BlockOutlineRenderState net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.rendertype.RenderType net.minecraft.client.renderer.RenderType
        jp net.minecraft.client.Camera net.minecraft.world.level.SignalGetter net.minecraft.world.phys.AABB net.minecraft.client.renderer.SubmitNodeCollector\$CustomGeometryRenderer net.minecraft.client.renderer.OrderedSubmitNodeCollector
        javap -cp "$MC" -p net.minecraft.client.renderer.RenderPipelines | grep -i -E 'line|debug|quad|filled|lightning|gui ' | head -60
        javap -cp "$MC" -p net.minecraft.client.renderer.LevelRenderer | grep -i -E 'outline|hit' | head -20
        javap -cp "$MC" -p -c net.minecraft.client.renderer.LevelRenderer | grep -A60 -E 'void (render|submit)BlockOutline' | grep -E 'invoke|getfield|ldc' | head -60
        SRC=$(find ~/.gradle -name 'neoforge-*-sources.jar' | head -1)
        mkdir -p /tmp/nf && (cd /tmp/nf && unzip -q -o "$SRC")
        grep -v '^import\|^ \*\|^/\*\|^$' /tmp/nf/net/neoforged/neoforge/client/NeoForgeRenderTypes.java | head -120
        grep -rn 'addCustomRenderer\|CustomBlockOutlineRenderer' /tmp/nf --include=*.java | grep -v 'event/ExtractBlockOutline\|client/CustomBlockOutline' | head
        grep -n 'registerSimpleItem\|registerItem' /tmp/nf/net/neoforged/neoforge/registries/DeferredRegister.java | head
