# Temporary: prints Minecraft 26.3 / NeoForge client rendering APIs so the port can be written against them.
name: Probe
on:
  push:
    branches: [ "claude/**" ]
    paths: [ "probe/**", ".github/workflows/probe.yml" ]
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: probe/26.3
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Make Minecraft artifacts
      run: ./gradlew --no-daemon createMinecraftArtifacts
    - name: Print APIs
      run: |
        set +e
        MC=build/moddev/artifacts/minecraft-patched-26.3.0.23-beta.jar
        jp() { for c in "$@"; do echo "################ $c"; javap -cp "$MC" -p "$c" 2>&1 | grep -v 'lambda\$' | head -80; done; }
        jp net.minecraft.gizmos.Gizmos net.minecraft.gizmos.GizmoProperties net.minecraft.gizmos.GizmoStyle net.minecraft.gizmos.CuboidGizmo net.minecraft.gizmos.SimpleGizmoCollector net.minecraft.gizmos.Gizmos\$TemporaryCollection net.minecraft.gizmos.GizmoCollector
        javap -cp "$MC" -p net.minecraft.client.renderer.LevelRenderer | grep -i gizmo
        javap -cp "$MC" -p net.minecraft.client.Minecraft | grep -i gizmo
        javap -cp "$MC" -p -c net.minecraft.client.renderer.LevelRenderer | grep -i -E 'gizmo|withCollector|Method .*(extract|submit|render)' | head -60
        javap -cp "$MC" -p -c net.minecraft.client.Minecraft | grep -i -E 'gizmo|withCollector' | head -20
        javap -cp "$MC" -p -c net.minecraft.client.renderer.feature.ShapeOutlineFeatureRenderer | head -120
        javap -cp "$MC" -p net.minecraft.client.renderer.rendertype.RenderSetup net.minecraft.client.renderer.rendertype.RenderSetup\$RenderSetupBuilder | head -80
        javap -cp "$MC" -p net.minecraft.client.renderer.RenderPipelines | grep -E 'LINES|DEBUG_FILLED|DEBUG_QUADS|FILLED' | head
        SRC=$(find ~/.gradle -name 'neoforge-*-sources.jar' | head -1)
        mkdir -p /tmp/nf && (cd /tmp/nf && unzip -q -o "$SRC")
        grep -rln -i 'gizmo' /tmp/nf | head
        grep -v '^import\|^ \*\|^/\*\|^$' /tmp/nf/net/neoforged/neoforge/client/NeoForgeRenderPipelines.java | head -60
